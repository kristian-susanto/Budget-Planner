<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wedding Budget Planner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💍</text></svg>"
    />
    <style>
      :root {
        --bg-body: #f0f2f5;
        --bg-card: #ffffff;
        --text-main: #333333;
        --text-sub: #666666;
        --input-bg: #ffffff;
        --input-border: #dddddd;
        --accent: #d63384;
        --accent-hover: #b92b71;
        --info-box: #fff3f8;
        --row-border: #eeeeee;
        --grand-total-bg: #e8f5e9;
        --grand-total-text: #198754;
        --danger: #dc3545;
        --danger-hover: #bd2130;
        --sub-row-bg: #fafafa;
      }
      [data-theme="dark"] {
        --bg-body: #121212;
        --bg-card: #1e1e1e;
        --text-main: #e0e0e0;
        --text-sub: #bbbbbb;
        --input-bg: #2d2d2d;
        --input-border: #444444;
        --info-box: #2d1a24;
        --row-border: #333333;
        --grand-total-bg: #1b2e1c;
        --grand-total-text: #81c784;
        --sub-row-bg: #252525;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        padding: 10px;
        margin: 0;
        transition: 0.3s;
      }

      .card {
        background: var(--bg-card);
        padding: 25px 15px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 650px;
        position: relative;
        box-sizing: border-box;
        margin-top: 20px;
      }

      .header-accent {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background: var(--accent);
        border-radius: 20px 20px 0 0;
      }

      .theme-switch {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: var(--info-box);
        border: 1px solid var(--input-border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition: 0.3s;
      }

      h2 {
        color: var(--accent);
        text-align: center;
        margin-bottom: 25px;
        font-size: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--input-border);
        border-radius: 8px;
        box-sizing: border-box;
        margin-bottom: 20px;
        background-color: var(--input-bg);
        color: var(--text-main);
        font-size: 1rem;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 5px rgba(214, 51, 132, 0.2);
      }

      button {
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }

      button.add-sub-btn {
        background-color: var(--accent);
        color: white;
        padding: 6px 12px;
        font-size: 0.8rem;
        border-radius: 4px;
        white-space: nowrap;
      }

      button.delete-btn {
        background-color: transparent;
        color: var(--danger);
        padding: 2px 6px;
        font-size: 0.9rem;
      }
      button.delete-btn:hover {
        color: var(--danger-hover);
      }

      .result {
        margin-top: 5px;
        padding-top: 10px;
      }

      .grand-total {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--grand-total-text);
        text-align: center;
        margin-top: 5px;
        background: var(--grand-total-bg);
        padding: 15px;
        border-radius: 8px;
        word-wrap: break-word;
      }

      .table-container {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin-top: 15px;
        border-radius: 8px;
      }

      .breakdown-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 520px;
      }

      .breakdown-table th {
        padding: 12px 10px;
        border: 1px solid var(--row-border);
        text-align: center;
        font-weight: bold;
        font-size: 0.85rem;
      }

      .breakdown-table td {
        padding: 10px;
        border: 1px solid var(--row-border);
        font-size: 0.85rem;
        vertical-align: middle;
      }

      .main-category-row {
        background-color: var(--info-box);
        font-weight: bold;
      }

      .category-name-input {
        background: transparent;
        border: 1px dashed transparent;
        color: var(--text-main);
        font-weight: bold;
        padding: 4px;
        margin-bottom: 0;
        width: 90%;
        border-radius: 4px;
      }
      .category-name-input:focus {
        background: var(--input-bg);
        border-color: var(--accent);
      }

      .sub-item-row {
        background-color: var(--sub-row-bg);
      }

      .sub-item-row td:first-child {
        padding-left: 25px;
        color: var(--text-sub);
        font-style: italic;
      }

      .percent-input {
        width: 85px;
        padding: 6px;
        text-align: center;
        border: 1px solid var(--input-border);
        border-radius: 4px;
        background: var(--input-bg);
        color: var(--text-main);
        margin-bottom: 0;
      }

      .inline-add-form {
        display: flex;
        gap: 5px;
        background-color: var(--sub-row-bg);
        padding: 6px 10px;
        border: 1px solid var(--row-border);
        border-top: none;
        align-items: center;
      }

      .inline-add-form label {
        margin-bottom: 0;
        font-size: 0.8rem;
        color: var(--text-sub);
        padding-left: 15px;
        white-space: nowrap;
      }

      .inline-add-form input {
        margin-bottom: 0;
        padding: 6px;
        font-size: 0.8rem;
        border-radius: 4px;
      }

      .global-add-form {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px dashed var(--input-border);
      }
      .global-add-inputs {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .global-add-inputs input {
        margin-bottom: 0;
      }
      .global-add-btn {
        background-color: #198754;
        color: white;
        white-space: nowrap;
      }
      .global-add-btn:hover {
        background-color: #157347;
      }

      .status-flex {
        margin-top: 12px;
        font-size: 0.85rem;
        font-weight: bold;
        text-align: right;
      }

      @media (max-width: 480px) {
        h2 {
          font-size: 1.2rem;
        }
        .card {
          padding: 20px 10px;
        }
        .grand-total {
          font-size: 1rem;
        }
        .global-add-inputs {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header-accent"></div>
      <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">
        🌙
      </button>

      <h2>Wedding Budget Planner</h2>

      <div class="input-group">
        <label id="budgetLabel">Total Wedding Budget:</label>
        <input
          type="text"
          id="budgetInput"
          placeholder=""
          oninput="processBudgetLive(this)"
        />
      </div>

      <div id="resultArea" class="result">
        <div class="grand-total" id="totalOutput">Total Budget: 0</div>

        <div style="margin-top: 20px">
          <p
            style="
              font-weight: bold;
              color: var(--accent);
              font-size: 0.95em;
              margin-bottom: 5px;
            "
          >
            Cost Allocation Breakdown:
          </p>

          <div class="table-container">
            <table class="breakdown-table">
              <thead>
                <tr style="background: var(--row-border)">
                  <th>Category / Sublist Item</th>
                  <th style="width: 105px">%</th>
                  <th style="width: 140px">Estimate</th>
                  <th style="width: 70px">Action</th>
                </tr>
              </thead>
              <tbody id="breakdownBody"></tbody>
            </table>
          </div>

          <div class="status-flex">
            <div id="statusPercent"></div>
          </div>

          <div class="global-add-form">
            <label style="color: var(--accent); font-weight: bold"
              >+ Add New Category</label
            >
            <div class="global-add-inputs">
              <input
                type="text"
                id="newMainCatName"
                placeholder="e.g., Entertainment, Honeymoon"
                style="flex-grow: 2"
              />
              <input
                type="number"
                id="newMainCatPercent"
                placeholder="%"
                style="max-width: 100px"
                min="0"
                max="100"
                step="0.01"
              />
              <button class="global-add-btn" onclick="addNewMainCategory()">
                Add Category
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
      const Toast = Swal.mixin({
        toast: true,
        position: "top",
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true,
      });

      let currentTotalBudget = 0;

      let allocation = [
        { name: "Catering", percent: 40.0, subitems: [] },
        { name: "Venue", percent: 20.0, subitems: [] },
        { name: "Decoration", percent: 10.0, subitems: [] },
        { name: "Attire & Makeup", percent: 10.0, subitems: [] },
        { name: "Documentation", percent: 10.0, subitems: [] },
        { name: "Souvenir", percent: 5.0, subitems: [] },
        { name: "Emergency Fund", percent: 5.0, subitems: [] },
      ];

      function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById("themeBtn");
        if (body.getAttribute("data-theme") === "dark") {
          body.removeAttribute("data-theme");
          btn.innerText = "🌙";
        } else {
          body.setAttribute("data-theme", "dark");
          btn.innerText = "☀️";
        }
      }

      function formatValue(num) {
        return new Intl.NumberFormat("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }).format(num);
      }

      function processBudgetLive(input) {
        let val = input.value.replace(/[^0-9]/g, "");
        if (val === "") {
          input.value = "";
          currentTotalBudget = 0;
          renderResults();
          return;
        }

        input.value = new Intl.NumberFormat("en-US").format(val);
        currentTotalBudget = parseFloat(val);
        renderResults();
      }

      function renderResults() {
        document.getElementById("totalOutput").innerText =
          `Total Budget: ${formatValue(currentTotalBudget)}`;

        let html = "";
        allocation.forEach((category, catIndex) => {
          let catNominal = (category.percent / 100) * currentTotalBudget;

          // Main Category
          html += `<tr class="main-category-row">
              <td>
                <input type="text" class="category-name-input" value="${category.name}" onchange="updateCategoryName(${catIndex}, this.value)">
              </td>
              <td style="text-align:center;">
                  <input type="number" class="percent-input" value="${Number(category.percent).toFixed(2)}" min="0" max="100" step="0.01" onchange="updatePercent(${catIndex}, this.value)">
              </td>
              <td style="text-align:right; font-weight:bold;">${formatValue(catNominal)}</td>
              <td style="text-align:center;">
                  <button class="delete-btn" onclick="deleteMainCategory(${catIndex})" title="Delete Category" style="color: var(--danger)">🗑️</button>
              </td>
            </tr>`;

          // Row Sub-item List
          category.subitems.forEach((subitem, subIndex) => {
            html += `<tr class="sub-item-row">
                <td>└─ ${subitem.name}</td>
                <td style="text-align:center; color:gray;">-</td>
                <td style="text-align:center; color:gray; font-size:0.8rem;">Sub-item</td>
                <td style="text-align:center;">
                    <button class="delete-btn" onclick="deleteSubItem(${catIndex}, ${subIndex})" title="Delete Sublist Item">🗑️</button>
                </td>
              </tr>`;
          });

          // Add Sub-item Form
          html += `<tr>
              <td colspan="4" style="padding:0;">
                <div class="inline-add-form">
                  <label id="label-sub-${catIndex}">+ Add to ${category.name}:</label>
                  <input type="text" id="input-sub-${catIndex}" placeholder="Add new item inside ${category.name}..." style="flex-grow:1; max-width:250px;">
                  <button class="add-sub-btn" onclick="addNewSubItem(${catIndex})">+ Add Item</button>
                </div>
              </td>
            </tr>`;
        });

        document.getElementById("breakdownBody").innerHTML = html;
        updateStatusLabel();
      }

      // Edit Main Category Name
      function updateCategoryName(index, newName) {
        const trimmedName = newName.trim();
        if (!trimmedName) {
          Toast.fire({
            icon: "warning",
            title: "Category name cannot be empty",
          });
          renderResults();
          return;
        }
        allocation[index].name = trimmedName;
        renderResults();
      }

      function updatePercent(index, val) {
        let value = parseFloat(val);
        if (isNaN(value) || value < 0) value = 0;
        allocation[index].percent = value;
        renderResults();
      }

      // Add Main Category Name
      function addNewMainCategory() {
        const nameInput = document.getElementById("newMainCatName");
        const percentInput = document.getElementById("newMainCatPercent");

        const catName = nameInput.value.trim();
        let catPercent = parseFloat(percentInput.value);

        if (!catName) {
          Toast.fire({ icon: "warning", title: "Please enter category name" });
          return;
        }
        if (isNaN(catPercent) || catPercent < 0) catPercent = 0;

        allocation.push({
          name: catName,
          percent: catPercent,
          subitems: [],
        });

        nameInput.value = "";
        percentInput.value = "";
        renderResults();
        Toast.fire({
          icon: "success",
          title: `Category "${catName}" added successfully`,
        });
      }

      // Delete Main Category Name
      function deleteMainCategory(index) {
        const removedName = allocation[index].name;
        allocation.splice(index, 1);
        renderResults();
        Toast.fire({
          icon: "success",
          title: `Deleted "${removedName}" category`,
        });
      }

      function addNewSubItem(catIndex) {
        const inputEl = document.getElementById(`input-sub-${catIndex}`);
        const subName = inputEl.value.trim();

        if (!subName) {
          Toast.fire({ icon: "warning", title: "Please enter item name" });
          return;
        }

        allocation[catIndex].subitems.push({ name: subName });
        inputEl.value = "";
        renderResults();
        Toast.fire({
          icon: "success",
          title: `Added "${subName}" to ${allocation[catIndex].name}`,
        });
      }

      function deleteSubItem(catIndex, subIndex) {
        const removedName = allocation[catIndex].subitems[subIndex].name;
        allocation[catIndex].subitems.splice(subIndex, 1);
        renderResults();
        Toast.fire({ icon: "success", title: `Removed "${removedName}"` });
      }

      function updateStatusLabel() {
        const total = allocation.reduce((sum, i) => sum + i.percent, 0);
        const el = document.getElementById("statusPercent");

        if (Math.abs(total - 100) < 0.001) {
          el.style.color = "var(--grand-total-text)";
          el.innerText = "✅ Total Allocation Perfect 100.00%";
        } else {
          el.style.color = "#ff9800";
          el.innerText = `⚠️ Total Allocation: ${total.toFixed(2)}% (Remains ${(100 - total).toFixed(2)}%)`;
        }
      }

      renderResults();
    </script>
  </body>
</html>
