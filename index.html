<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Budget Planner</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💰</text></svg>"
    />
    <style>
      :root {
        --bg-body: #f4f6fb;
        --bg-card: #ffffff;
        --text-main: #1f2937;
        --text-sub: #6b7280;
        --input-bg: #ffffff;
        --input-border: #d7dce5;
        --accent: #4f46e5;
        --accent-hover: #4338ca;
        --info-box: #eef2ff;
        --row-border: #e8ebf2;
        --grand-total-bg: #ecfdf5;
        --grand-total-text: #059669;
        --danger: #dc3545;
        --danger-hover: #bd2130;
        --sub-row-bg: #fafbfe;
        --success: #0d9488;
        --success-hover: #0f766e;
      }
      [data-theme="dark"] {
        --bg-body: #0f1117;
        --bg-card: #1a1d26;
        --text-main: #e5e7eb;
        --text-sub: #9ca3af;
        --input-bg: #262a36;
        --input-border: #3a4050;
        --accent: #6366f1;
        --accent-hover: #818cf8;
        --info-box: #1e2235;
        --row-border: #2b3040;
        --grand-total-bg: #10261f;
        --grand-total-text: #34d399;
        --sub-row-bg: #20242f;
        --success: #14b8a6;
        --success-hover: #2dd4bf;
      }

      * {
        -webkit-tap-highlight-color: transparent;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-body);
        color: var(--text-main);
        display: flex;
        justify-content: center;
        padding: 10px;
        margin: 0;
        min-height: 100vh;
        box-sizing: border-box;
        transition: background-color 0.3s, color 0.3s;
      }

      .card {
        background: var(--bg-card);
        padding: 25px 15px;
        border-radius: 20px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        width: 100%;
        max-width: 680px;
        position: relative;
        box-sizing: border-box;
        margin-top: 20px;
        align-self: flex-start;
      }

      .header-accent {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 8px;
        background: linear-gradient(90deg, var(--accent), var(--success));
        border-radius: 20px 20px 0 0;
      }

      .theme-switch {
        position: absolute;
        top: 15px;
        right: 15px;
        width: 35px;
        height: 35px;
        border-radius: 50%;
        background: var(--info-box);
        border: 1px solid var(--input-border);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1rem;
        transition: 0.3s;
      }
      .theme-switch:hover {
        transform: scale(1.08);
      }

      h2 {
        color: var(--accent);
        text-align: center;
        margin-bottom: 25px;
        font-size: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
        font-size: 0.9rem;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--input-border);
        border-radius: 8px;
        box-sizing: border-box;
        margin-bottom: 20px;
        background-color: var(--input-bg);
        color: var(--text-main);
        font-size: 1rem;
      }

      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 5px rgba(79, 70, 229, 0.25);
      }

      button {
        padding: 12px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-weight: bold;
        transition: 0.2s;
      }

      button.add-sub-btn {
        background-color: var(--accent);
        color: white;
        padding: 6px 12px;
        font-size: 0.8rem;
        border-radius: 4px;
        white-space: nowrap;
      }
      button.add-sub-btn:hover {
        background-color: var(--accent-hover);
      }

      button.delete-btn {
        background-color: transparent;
        color: var(--danger);
        padding: 2px 6px;
        font-size: 0.9rem;
      }
      button.delete-btn:hover {
        color: var(--danger-hover);
      }

      .result {
        margin-top: 5px;
        padding-top: 10px;
      }

      .grand-total {
        font-size: 1.2rem;
        font-weight: bold;
        color: var(--grand-total-text);
        text-align: center;
        margin-top: 5px;
        background: var(--grand-total-bg);
        padding: 15px;
        border-radius: 8px;
        word-wrap: break-word;
      }

      .table-container {
        width: 100%;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        margin-top: 15px;
        border-radius: 8px;
      }

      .breakdown-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 520px;
      }

      .breakdown-table th {
        padding: 12px 10px;
        border: 1px solid var(--row-border);
        text-align: center;
        font-weight: bold;
        font-size: 0.85rem;
      }

      .breakdown-table td {
        padding: 10px;
        border: 1px solid var(--row-border);
        font-size: 0.85rem;
        vertical-align: middle;
      }

      .main-category-row {
        background-color: var(--info-box);
        font-weight: bold;
      }

      .category-name-input {
        background: transparent;
        border: 1px dashed transparent;
        color: var(--text-main);
        font-weight: bold;
        padding: 4px;
        margin-bottom: 0;
        width: 90%;
        border-radius: 4px;
        font-size: 0.85rem;
      }
      .category-name-input:focus {
        background: var(--input-bg);
        border-color: var(--accent);
      }

      .sub-item-row {
        background-color: var(--sub-row-bg);
      }

      .sub-item-row td:first-child {
        padding-left: 25px;
        color: var(--text-sub);
        font-style: italic;
      }

      .percent-input {
        width: 85px;
        padding: 6px;
        text-align: center;
        border: 1px solid var(--input-border);
        border-radius: 4px;
        background: var(--input-bg);
        color: var(--text-main);
        margin-bottom: 0;
      }

      /* Hide spinner arrows on percent inputs */
      .percent-input::-webkit-outer-spin-button,
      .percent-input::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      .percent-input {
        -moz-appearance: textfield; /* Firefox */
      }

      .inline-add-form {
        display: flex;
        gap: 5px;
        background-color: var(--sub-row-bg);
        padding: 6px 10px;
        border: 1px solid var(--row-border);
        border-top: none;
        align-items: center;
        flex-wrap: wrap;
      }

      .inline-add-form label {
        margin-bottom: 0;
        font-size: 0.8rem;
        color: var(--text-sub);
        padding-left: 15px;
        white-space: nowrap;
      }

      .inline-add-form input {
        margin-bottom: 0;
        padding: 6px;
        font-size: 0.8rem;
        border-radius: 4px;
      }

      .global-add-form {
        margin-top: 25px;
        padding-top: 20px;
        border-top: 1px dashed var(--input-border);
      }
      .global-add-inputs {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .global-add-inputs input {
        margin-bottom: 0;
      }
      .global-add-btn {
        background-color: var(--success);
        color: white;
        white-space: nowrap;
      }
      .global-add-btn:hover {
        background-color: var(--success-hover);
      }

      .status-flex {
        margin-top: 12px;
        font-size: 0.85rem;
        font-weight: bold;
        text-align: right;
      }

      /* Export section */
      .export-section {
        margin-top: 25px;
        padding-top: 15px;
        border-top: 1px dashed var(--input-border);
        text-align: center;
      }
      .export-section label {
        font-weight: bold;
        color: var(--accent);
        margin-bottom: 10px;
      }
      .export-buttons {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: center;
      }
      .export-buttons button {
        background-color: var(--info-box);
        color: var(--text-main);
        border: 1px solid var(--input-border);
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        transition: all 0.2s;
      }
      .export-buttons button:hover {
        background-color: var(--accent);
        color: white;
        border-color: var(--accent);
      }

      @media (max-width: 480px) {
        h2 {
          font-size: 1.2rem;
        }
        .card {
          padding: 20px 10px;
          border-radius: 16px;
        }
        .grand-total {
          font-size: 1rem;
        }
        .global-add-inputs {
          flex-direction: column;
        }
        .global-add-inputs input {
          max-width: none !important;
        }
        .inline-add-form input {
          max-width: none !important;
          flex-grow: 1;
        }
        .status-flex {
          text-align: left;
        }
        .export-buttons button {
          padding: 6px 10px;
          font-size: 0.75rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header-accent"></div>
      <button class="theme-switch" onclick="toggleTheme()" id="themeBtn">
        🌙
      </button>

      <h2>Budget Planner</h2>

      <div class="input-group">
        <label id="budgetLabel">Total Budget:</label>
        <input
          type="text"
          id="budgetInput"
          placeholder="Enter your total budget"
          oninput="processBudgetLive(this)"
        />
      </div>

      <div id="resultArea" class="result">
        <div class="grand-total" id="totalOutput">Total Budget: 0</div>

        <div style="margin-top: 20px">
          <p
            style="
              font-weight: bold;
              color: var(--accent);
              font-size: 0.95em;
              margin-bottom: 5px;
            "
          >
            Budget Allocation Breakdown:
          </p>

          <div class="table-container">
            <table class="breakdown-table">
              <thead>
                <tr style="background: var(--row-border)">
                  <th>Category / Sub-item</th>
                  <th style="width: 105px">%</th>
                  <th style="width: 140px">Estimate</th>
                  <th style="width: 70px">Action</th>
                </tr>
              </thead>
              <tbody id="breakdownBody"></tbody>
            </table>
          </div>

          <div class="status-flex">
            <div id="statusPercent"></div>
          </div>

          <div class="global-add-form">
            <label style="color: var(--accent); font-weight: bold"
              >+ Add New Category</label
            >
            <div class="global-add-inputs">
              <input
                type="text"
                id="newMainCatName"
                placeholder="e.g., Education, Travel, Insurance"
                style="flex-grow: 2"
              />
              <input
                type="number"
                id="newMainCatPercent"
                placeholder="%"
                style="max-width: 100px"
                min="0"
                max="100"
                step="0.5"
              />
              <button class="global-add-btn" onclick="addNewMainCategory()">
                Add Category
              </button>
            </div>
          </div>

          <!-- Export Section -->
          <div class="export-section">
            <label>Export Data:</label>
            <div class="export-buttons">
              <button onclick="exportCSV()">CSV</button>
              <button onclick="exportXLSX()">XLSX</button>
              <button onclick="exportJSON()">JSON</button>
              <button onclick="exportPNG()">PNG</button>
              <button onclick="exportJPG()">JPG</button>
              <button onclick="exportPDF()">PDF</button>
              <button onclick="exportSVG()">SVG</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dom-to-image@2.6.0/dist/dom-to-image.min.js"></script>

    <script>
      // --- SweetAlert Toast ---
      const Toast = Swal.mixin({
        toast: true,
        position: "top",
        showConfirmButton: false,
        timer: 2000,
        timerProgressBar: true,
      });

      // --- State ---
      let currentTotalBudget = 0;

      let allocation = [
        { name: "Housing & Rent", percent: 30.0, subitems: [] },
        { name: "Food & Groceries", percent: 15.0, subitems: [] },
        { name: "Transportation", percent: 10.0, subitems: [] },
        { name: "Utilities & Bills", percent: 8.0, subitems: [] },
        { name: "Savings & Investments", percent: 12.0, subitems: [] },
        { name: "Health & Insurance", percent: 7.0, subitems: [] },
        { name: "Entertainment & Leisure", percent: 8.0, subitems: [] },
        { name: "Miscellaneous", percent: 10.0, subitems: [] },
      ];

      // --- Theme Toggle ---
      function toggleTheme() {
        const body = document.body;
        const btn = document.getElementById("themeBtn");
        if (body.getAttribute("data-theme") === "dark") {
          body.removeAttribute("data-theme");
          btn.innerText = "🌙";
        } else {
          body.setAttribute("data-theme", "dark");
          btn.innerText = "☀️";
        }
      }

      // --- Formatting ---
      function formatValue(num) {
        return new Intl.NumberFormat("en-US", {
          minimumFractionDigits: 0,
          maximumFractionDigits: 0,
        }).format(num);
      }

      // --- Live Budget Input ---
      function processBudgetLive(input) {
        let val = input.value.replace(/[^0-9]/g, "");
        if (val === "") {
          input.value = "";
          currentTotalBudget = 0;
          renderResults();
          return;
        }
        input.value = new Intl.NumberFormat("en-US").format(val);
        currentTotalBudget = parseFloat(val);
        renderResults();
      }

      // --- Render Table ---
      function renderResults() {
        document.getElementById("totalOutput").innerText =
          `Total Budget: ${formatValue(currentTotalBudget)}`;

        let html = "";
        allocation.forEach((category, catIndex) => {
          let catNominal = (category.percent / 100) * currentTotalBudget;

          html += `<tr class="main-category-row">
              <td>
                <input type="text" class="category-name-input" value="${category.name}" onchange="updateCategoryName(${catIndex}, this.value)">
              </td>
              <td style="text-align:center;">
                  <input type="number" class="percent-input" value="${Number(category.percent).toFixed(2)}" min="0" max="100" step="0.5" onchange="updatePercent(${catIndex}, this.value)">
              </td>
              <td style="text-align:right; font-weight:bold;">${formatValue(catNominal)}</td>
              <td style="text-align:center;">
                  <button class="delete-btn" onclick="deleteMainCategory(${catIndex})" title="Delete Category" style="color: var(--danger)">🗑️</button>
              </td>
            </tr>`;

          category.subitems.forEach((subitem, subIndex) => {
            html += `<tr class="sub-item-row">
                <td>└─ ${subitem.name}</td>
                <td style="text-align:center; color:gray;">-</td>
                <td style="text-align:center; color:gray; font-size:0.8rem;">Sub-item</td>
                <td style="text-align:center;">
                    <button class="delete-btn" onclick="deleteSubItem(${catIndex}, ${subIndex})" title="Delete Sub-item">🗑️</button>
                </td>
              </tr>`;
          });

          html += `<tr class="add-row">
              <td colspan="4" style="padding:0;">
                <div class="inline-add-form">
                  <label id="label-sub-${catIndex}">+ Add to ${category.name}:</label>
                  <input type="text" id="input-sub-${catIndex}" placeholder="Add new item inside ${category.name}..." style="flex-grow:1; max-width:250px;">
                  <button class="add-sub-btn" onclick="addNewSubItem(${catIndex})">+ Add Item</button>
                </div>
              </td>
            </tr>`;
        });

        document.getElementById("breakdownBody").innerHTML = html;
        updateStatusLabel();
      }

      // --- CRUD Operations ---
      function updateCategoryName(index, newName) {
        const trimmedName = newName.trim();
        if (!trimmedName) {
          Toast.fire({
            icon: "warning",
            title: "Category name cannot be empty",
          });
          renderResults();
          return;
        }
        allocation[index].name = trimmedName;
        renderResults();
      }

      function updatePercent(index, val) {
        let value = parseFloat(val);
        if (isNaN(value) || value < 0) value = 0;
        allocation[index].percent = value;
        renderResults();
      }

      function addNewMainCategory() {
        const nameInput = document.getElementById("newMainCatName");
        const percentInput = document.getElementById("newMainCatPercent");

        const catName = nameInput.value.trim();
        let catPercent = parseFloat(percentInput.value);

        if (!catName) {
          Toast.fire({ icon: "warning", title: "Please enter category name" });
          return;
        }
        if (isNaN(catPercent) || catPercent < 0) catPercent = 0;

        allocation.push({ name: catName, percent: catPercent, subitems: [] });
        nameInput.value = "";
        percentInput.value = "";
        renderResults();
        Toast.fire({
          icon: "success",
          title: `Category "${catName}" added successfully`,
        });
      }

      function deleteMainCategory(index) {
        const removedName = allocation[index].name;
        allocation.splice(index, 1);
        renderResults();
        Toast.fire({
          icon: "success",
          title: `Deleted "${removedName}" category`,
        });
      }

      function addNewSubItem(catIndex) {
        const inputEl = document.getElementById(`input-sub-${catIndex}`);
        const subName = inputEl.value.trim();
        if (!subName) {
          Toast.fire({ icon: "warning", title: "Please enter item name" });
          return;
        }
        allocation[catIndex].subitems.push({ name: subName });
        inputEl.value = "";
        renderResults();
        Toast.fire({
          icon: "success",
          title: `Added "${subName}" to ${allocation[catIndex].name}`,
        });
      }

      function deleteSubItem(catIndex, subIndex) {
        const removedName = allocation[catIndex].subitems[subIndex].name;
        allocation[catIndex].subitems.splice(subIndex, 1);
        renderResults();
        Toast.fire({ icon: "success", title: `Removed "${removedName}"` });
      }

      function updateStatusLabel() {
        const total = allocation.reduce((sum, i) => sum + i.percent, 0);
        const el = document.getElementById("statusPercent");
        if (Math.abs(total - 100) < 0.001) {
          el.style.color = "var(--grand-total-text)";
          el.innerText = "✅ Total Allocation Perfect 100.00%";
        } else {
          el.style.color = "#ff9800";
          el.innerText = `⚠️ Total Allocation: ${total.toFixed(2)}% (Remains ${(100 - total).toFixed(2)}%)`;
        }
      }

      // ================================================================
      // EXPORT HELPERS
      // ================================================================

      function getExportData() {
        return {
          totalBudget: currentTotalBudget,
          allocation: allocation.map((cat) => ({
            name: cat.name,
            percent: cat.percent,
            estimate: (cat.percent / 100) * currentTotalBudget,
            subitems: cat.subitems.map((s) => s.name),
          })),
        };
      }

      function buildCleanExportHTML() {
        const totalPercent = allocation.reduce((sum, i) => sum + i.percent, 0);
        const isPerfect = Math.abs(totalPercent - 100) < 0.001;

        let rows = "";
        allocation.forEach((category) => {
          const catNominal = (category.percent / 100) * currentTotalBudget;

          rows += `
            <tr style="background:#eef2ff; font-weight:bold;">
              <td style="padding:10px 12px; border:1px solid #d7dce5; color:#1f2937;">${escapeHtml(category.name)}</td>
              <td style="padding:10px 12px; border:1px solid #d7dce5; text-align:center; color:#1f2937;">${Number(category.percent).toFixed(2)}%</td>
              <td style="padding:10px 12px; border:1px solid #d7dce5; text-align:right; color:#1f2937;">${formatValue(catNominal)}</td>
            </tr>`;

          category.subitems.forEach((sub) => {
            rows += `
              <tr style="background:#fafbfe;">
                <td style="padding:8px 12px 8px 32px; border:1px solid #d7dce5; color:#6b7280; font-style:italic;">└─ ${escapeHtml(sub.name)}</td>
                <td style="padding:8px 12px; border:1px solid #d7dce5; text-align:center; color:#9ca3af;">–</td>
                <td style="padding:8px 12px; border:1px solid #d7dce5; text-align:center; color:#9ca3af; font-size:12px;">Sub-item</td>
              </tr>`;
          });
        });

        const statusColor = isPerfect ? "#059669" : "#d97706";
        const statusText = isPerfect
          ? "✅ Total Allocation: 100.00%"
          : `⚠️ Total Allocation: ${totalPercent.toFixed(2)}% (Remaining: ${(100 - totalPercent).toFixed(2)}%)`;

        return `
          <div style="font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:#ffffff; width:720px; padding:32px; box-sizing:border-box; color:#1f2937;">
            <div style="height:8px; background:linear-gradient(90deg,#4f46e5,#0d9488); border-radius:8px 8px 0 0; margin:-32px -32px 24px -32px;"></div>
            <h1 style="color:#4f46e5; text-align:center; margin:0 0 18px 0; font-size:24px;">Budget Planner</h1>
            <div style="background:#ecfdf5; color:#059669; font-size:18px; font-weight:bold; text-align:center; padding:16px; border-radius:8px; margin-bottom:24px;">
              Total Budget: ${formatValue(currentTotalBudget)}
            </div>
            <h3 style="color:#4f46e5; margin:0 0 12px 0; font-size:15px;">Budget Allocation Breakdown</h3>
            <table style="width:100%; border-collapse:collapse; font-size:14px; border-radius:8px; overflow:hidden;">
              <thead>
                <tr style="background:#e8ebf2;">
                  <th style="padding:12px; border:1px solid #d7dce5; text-align:left; color:#1f2937;">Category / Sub-item</th>
                  <th style="padding:12px; border:1px solid #d7dce5; text-align:center; width:90px; color:#1f2937;">%</th>
                  <th style="padding:12px; border:1px solid #d7dce5; text-align:right; width:140px; color:#1f2937;">Estimate</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
            <div style="text-align:right; margin-top:18px; font-weight:bold; color:${statusColor}; font-size:14px;">
              ${statusText}
            </div>
            <div style="text-align:center; margin-top:32px; font-size:12px; color:#9ca3af; border-top:1px dashed #d7dce5; padding-top:16px;">
              Generated by Budget Planner &middot; ${new Date().toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric" })}
            </div>
          </div>
        `;
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function withCleanContainer(callback) {
        const container = document.createElement("div");
        container.style.position = "fixed";
        container.style.left = "-10000px";
        container.style.top = "0";
        container.style.background = "#ffffff";
        container.innerHTML = buildCleanExportHTML();
        document.body.appendChild(container);

        const target = container.firstElementChild;

        requestAnimationFrame(() => {
          setTimeout(() => {
            callback(target, () => {
              if (container.parentNode) document.body.removeChild(container);
            });
          }, 60);
        });
      }

      // --- CSV Export ---
      function exportCSV() {
        const data = getExportData();
        let csv = "Category,Percent,Estimate,Sub-items\n";
        data.allocation.forEach((cat) => {
          const subitems = cat.subitems.join("; ");
          csv +=
            [
              `"${cat.name.replace(/"/g, '""')}"`,
              cat.percent.toFixed(2),
              cat.estimate.toFixed(2),
              `"${subitems.replace(/"/g, '""')}"`,
            ].join(",") + "\n";
        });
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "budget-planner.csv";
        link.click();
        Toast.fire({ icon: "success", title: "CSV downloaded" });
      }

      // --- XLSX Export ---
      function exportXLSX() {
        const data = getExportData();
        const rows = data.allocation.map((cat) => ({
          Category: cat.name,
          "Percent (%)": cat.percent,
          Estimate: cat.estimate,
          "Sub-items": cat.subitems.join("; "),
        }));
        const ws = XLSX.utils.json_to_sheet(rows);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Budget");
        XLSX.writeFile(wb, "budget-planner.xlsx");
        Toast.fire({ icon: "success", title: "XLSX downloaded" });
      }

      // --- JSON Export ---
      function exportJSON() {
        const data = getExportData();
        const blob = new Blob([JSON.stringify(data, null, 2)], {
          type: "application/json",
        });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = "budget-planner.json";
        link.click();
        Toast.fire({ icon: "success", title: "JSON downloaded" });
      }

      // --- PNG Export ---
      function exportPNG() {
        withCleanContainer((target, cleanup) => {
          html2canvas(target, {
            scale: 2,
            backgroundColor: "#ffffff",
            useCORS: true,
          })
            .then((canvas) => {
              cleanup();
              const link = document.createElement("a");
              link.download = "budget-planner.png";
              link.href = canvas.toDataURL("image/png");
              link.click();
              Toast.fire({ icon: "success", title: "PNG downloaded" });
            })
            .catch((err) => {
              cleanup();
              console.error(err);
              Toast.fire({ icon: "error", title: "PNG export failed" });
            });
        });
      }

      // --- JPG Export ---
      function exportJPG() {
        withCleanContainer((target, cleanup) => {
          html2canvas(target, {
            scale: 2,
            backgroundColor: "#ffffff",
            useCORS: true,
          })
            .then((canvas) => {
              cleanup();
              const link = document.createElement("a");
              link.download = "budget-planner.jpg";
              link.href = canvas.toDataURL("image/jpeg", 0.92);
              link.click();
              Toast.fire({ icon: "success", title: "JPG downloaded" });
            })
            .catch((err) => {
              cleanup();
              console.error(err);
              Toast.fire({ icon: "error", title: "JPG export failed" });
            });
        });
      }

      // --- PDF Export ---
      function exportPDF() {
        withCleanContainer((target, cleanup) => {
          html2canvas(target, {
            scale: 2,
            backgroundColor: "#ffffff",
            useCORS: true,
          })
            .then((canvas) => {
              cleanup();
              const imgData = canvas.toDataURL("image/png");
              const { jsPDF } = window.jspdf;
              const pdf = new jsPDF("p", "mm", "a4");
              const pageWidth = 210;
              const pageHeight = 297;
              const imgWidth = pageWidth;
              const imgHeight = (canvas.height * imgWidth) / canvas.width;

              let heightLeft = imgHeight;
              let position = 0;

              pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
              heightLeft -= pageHeight;

              while (heightLeft > 0) {
                position = heightLeft - imgHeight;
                pdf.addPage();
                pdf.addImage(imgData, "PNG", 0, position, imgWidth, imgHeight);
                heightLeft -= pageHeight;
              }
              pdf.save("budget-planner.pdf");
              Toast.fire({ icon: "success", title: "PDF downloaded" });
            })
            .catch((err) => {
              cleanup();
              console.error(err);
              Toast.fire({ icon: "error", title: "PDF export failed" });
            });
        });
      }

      // --- SVG Export ---
      function exportSVG() {
        withCleanContainer((target, cleanup) => {
          domtoimage
            .toSvg(target, {
              bgcolor: "#ffffff",
              width: target.offsetWidth,
              height: target.offsetHeight,
            })
            .then((dataUrl) => {
              cleanup();
              const link = document.createElement("a");
              link.download = "budget-planner.svg";
              link.href = dataUrl;
              link.click();
              Toast.fire({ icon: "success", title: "SVG downloaded" });
            })
            .catch((err) => {
              cleanup();
              console.error(err);
              Toast.fire({ icon: "error", title: "SVG export failed" });
            });
        });
      }

      // --- Initial Render ---
      renderResults();
    </script>
  </body>
</html>
